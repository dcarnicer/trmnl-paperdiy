# Releases of the M5Stack PaperDIY community port, adapted from dcarnicer/paperdiy-reader.
# Push a tag paperdiy-vX.Y.Z-N (X.Y.Z = firmware version in include/config.h, N = port revision).
name: release-paperdiy

on:
  push:
    tags:
      - "paperdiy-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate release tag
        run: python3 scripts/paperdiy/check_release_version.py "${GITHUB_REF_NAME}"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-paperdiy-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-paperdiy-

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio==6.1.19

      - name: Build
        run: pio run -e TRMNL_X_PAPERDIY

      - name: Prepare release assets
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME#paperdiy-v}"
          full="trmnl-paperdiy-latest.bin"
          app="trmnl-paperdiy-${version}-app.bin"
          cp .pio/build/TRMNL_X_PAPERDIY/trmnl-paperdiy-factory.bin "dist/${full}"
          cp .pio/build/TRMNL_X_PAPERDIY/firmware.bin "dist/${app}"
          python3 scripts/paperdiy/check_release_assets.py "dist/${full}" "dist/${app}"
          (cd dist && sha256sum *.bin > SHA256SUMS.txt)
          # What standalone boards read once a day to update themselves (src/paperdiy_ota.cpp),
          # from releases/latest: release candidates (prereleases) are never offered
          app_sha=$(sha256sum "dist/${app}" | cut -d' ' -f1)
          app_size=$(stat -c %s "dist/${app}")
          cat > dist/latest.json <<JSON
          {
            "version": "${version}",
            "app_url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${app}",
            "app_size": ${app_size},
            "app_sha256": "${app_sha}"
          }
          JSON
          python3 -m json.tool dist/latest.json
          cat > dist/RELEASE_NOTES.md <<NOTES
          TRMNL firmware for the M5Stack PaperDIY (community port) ${version}: TRMNL firmware ${version%%-*}, port revision ${version#*-}.

          | File | Use |
          |---|---|
          | \`${full}\` | **Full image (0x0).** Install with M5Burner or esptool, or from M5Launcher (SD, WebUI, Favorites). Always-latest link: \`https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${full}\` |
          | \`${app}\` | App only. Under M5Launcher, write it at the offset of this app's partition with esptool to update without the SD (see docs/paperdiy.md). Never at 0x10000 with Launcher installed. |

          Installed standalone (full image, 1.8.20-2 or later), the firmware updates itself from \`latest.json\` once a day, on USB or with the battery at 50 % or more. Under M5Launcher it does not: update it from Launcher. Coming from 1.8.20-1 or from Launcher, install the full image once and set up Wi-Fi again in the portal: the data partition moved. See [docs/paperdiy.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/paperdiy.md).
          NOTES

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.bin
            dist/SHA256SUMS.txt
            dist/latest.json
          body_path: dist/RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          fail_on_unmatched_files: true
